[package]
name = "genropy-runner"
version = "0.1.0"
description = "Desktop window for a GenroPy instance"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "genropy_runner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["devices"]
# The Python sidecar and card signing (PKCS#11). The distributed site runner is built without it.
devices = ["dep:cryptoki", "dep:x509-parser"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cryptoki = { version = "0.12.1", optional = true }
sha2 = "0.11.1"
base64 = "0.23.1"
x509-parser = { version = "0.18.1", optional = true }
tokio = { version = "1.54.1", features = ["sync", "time"] }
ring = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSOpenPanel", "NSSavePanel", "NSApplication", "NSWindow", "NSDockTile", "block2"] }
block2 = "0.6"
