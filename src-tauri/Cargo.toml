[package]
name = "genropy-runner"
version = "0.2.0"
description = "Desktop window for a GenroPy instance"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "genropy_runner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["cards", "sidecar"]
# Card signing (PKCS#11): the card commands, the PIN window and the menu "Firma digitale".
cards = ["dep:cryptoki", "dep:x509-parser"]
# The Python sidecar and `device_call`. Only the "industry" build has it; the distributed site runner does not.
sidecar = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cryptoki = { version = "0.12.1", optional = true }
sha2 = "0.11.1"
base64 = "0.23.1"
x509-parser = { version = "0.18.1", optional = true }
tokio = { version = "1.54.1", features = ["sync", "time"] }
ring = "0.17"
# The RunDoc of a site, read at /_tools/rundoc. The CA trust of the OS decides which certificates are valid.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# The answers of the fiscal cash registers (fpmate.cgi).
quick-xml = "0.42"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSOpenPanel", "NSSavePanel", "NSApplication", "NSWindow", "NSDockTile", "block2"] }
block2 = "0.6"
# The device key of each site: Secure Enclave P-256 in the data protection keychain.
security-framework = { version = "3", features = ["OSX_10_15"] }
core-foundation = "0.10"
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext"] }
