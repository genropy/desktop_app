<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Aggiungi sito</title>
  <link rel="stylesheet" href="setup.css">
  <script src="addsite.js" defer></script>
</head>
<body>
  <form id="form">
    <label for="address">Indirizzo del sito</label>
    <input id="address" type="text" placeholder="app.esempio.it" autocomplete="url" spellcheck="false" required autofocus>
    <p id="error"></p>
    <button type="submit" id="add">Aggiungi</button>
  </form>
</body>
</html>
