<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Gestione</title>
  <link rel="stylesheet" href="setup.css">
  <link rel="stylesheet" href="manage.css">
  <script src="manage.js" defer></script>
</head>
<body class="manage">
  <section>
    <h2>Siti</h2>
    <table>
      <thead><tr><th>Sito</th><th>Utente</th><th>Verifica</th><th></th></tr></thead>
      <tbody id="sites"></tbody>
    </table>
  </section>
  <section>
    <h2>Registratori di cassa</h2>
    <table>
      <thead><tr><th>Sito</th><th>Indirizzo del registratore</th><th>HTTPS</th><th></th></tr></thead>
      <tbody id="registers"></tbody>
    </table>
    <small>Epson FP-81 II RT e FP-90 III RT. HTTPS solo se il registratore ha SSL attivo (SET 34).</small>
  </section>
  <section id="cards-section" hidden>
    <h2>Carte di firma</h2>
    <table>
      <thead><tr><th>Titolare</th><th>Scadenza</th><th>Stato</th><th></th></tr></thead>
      <tbody id="cards"></tbody>
    </table>
    <div class="buttons"><button id="refresh-cards">Rileggi i lettori</button></div>
  </section>
  <p id="message"></p>
</body>
</html>
